{% extends 'base.html' %}

{% block content %}

<h2>Upload Your Resume 📄</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="resume" required>
    <button type="submit">Analyze</button>
</form>

<hr>

{% if text %}
<h3>Extracted Text:</h3>
<pre>{{ text }}</pre>
{% endif %}

{% endblock %}
