<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Career Assistant</title>
    {% load static %}

    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #050814;
            color: white;
        }

        /* ========================= NAVBAR BASE ========================= */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 28px;

    /* soft green glass */
    background:rgba(236, 253, 245, 0.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    /* subtle green border */
    border-bottom:1px solid rgba(34,197,94,0.18);

    /* soft depth */
    box-shadow:0 1px 0 rgba(34,197,94,0.08);

    position:sticky;
    top:0;
    z-index:100;

    transition:all .25s ease;

    
}
.navbar::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(34,197,94,0.6),
        rgba(16,185,129,0.6),
        transparent
    );
    opacity:0.7;
}
/* ========================= LEFT NAV ========================= */
.nav-left{
    display:flex;
    align-items:center;
    gap:14px;
}

/* NAV LINK */
.nav-link{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:10px;
    text-decoration:none;
    font-weight:600;
    color:#0f3d2e;
    font-size:14px;
    transition:.25s ease;
    position:relative;
}

/* HOVER */
.nav-link:hover{
    background:#f0fdf4;
    transform:translateY(-1px);
}

/* ACTIVE STATE */
.nav-link.active{
    background:#ecfdf5;
    border:1px solid #bbf7d0;
}

/* SMALL DOT (SaaS indicator) */
.nav-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 0 4px rgba(34,197,94,0.15);
}

/* ========================= RIGHT SIDE ========================= */
.nav-right{
    display:flex;
    align-items:center;
}

/* LOGOUT BUTTON */
.logout-btn{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    border-radius:12px;

    border:1px solid rgba(34,197,94,0.25);
    background:rgba(236,253,245,0.7);

    color:#16a34a;
    font-weight:600;
    font-size:14px;

    cursor:pointer;
    transition:.25s ease;
}

/* HOVER EFFECT */
.logout-btn:hover{
    background:#16a34a;
    color:white;
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(34,197,94,0.25);
}
/* ICON ANIMATION */
.logout-icon{
    transition:.2s ease;
}

.logout-btn:hover .logout-icon{
    transform:translateX(-3px);
}

/* ========================= RESPONSIVE ========================= */
@media(max-width:600px){
    .navbar{
        padding:12px 16px;
    }

    .nav-link{
        font-size:13px;
        padding:6px 10px;
    }
}
    </style>
</head>

<body>

<!-- GLOBAL NAVBAR -->
<div class="navbar">

    <div class="nav-left">
        <a class="nav-link active" href="/dashboard/">
            <span class="nav-dot"></span>
            Dashboard
        </a>
    </div>

    <div class="nav-right">
        <form method="POST" action="{% url 'logout' %}" class="logout-form">
            {% csrf_token %}

            <button type="submit" class="logout-btn">
                <span class="logout-icon">⎋</span>
                <span>Logout</span>
            </button>
        </form>
    </div>

</div>

<!-- PAGE CONTENT -->
<div class="content">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
